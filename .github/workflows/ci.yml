name: CI

# SÓ `pull_request`, de propósito (custo: com o repositório privado, minuto de
# Actions é cobrado). O `push` na `main` repetia esta suíte inteira (~14 min) sobre
# uma árvore que já tinha passado aqui: o ruleset exige `test` e `e2e` verdes no PR
# e a branch em dia com a base, e o merge é squash, então o que chega à `main` é
# exatamente o que foi testado. `test/workflows-economia.test.ts` reprova a volta
# do `push`.
#
# NÃO acrescente `paths`/`paths-ignore`: PR que não dispara o workflow não reporta
# os checks obrigatórios, e check obrigatório que não reporta trava o merge.
on:
  # Sem filtro de branch: `branches: [main]` casa com a BASE do PR, então PR
  # empilhado sobre outro branch não rodava job nenhum — e "0 checks" se parece
  # com "ainda não começou", não com "não vai rodar". Aconteceu no PR #14.
  pull_request:

# O CI só lê o repositório. Sem isso, o GITHUB_TOKEN vem com escrita por padrão.
permissions:
  contents: read

# Push novo no mesmo PR cancela a execução anterior, que já não vale nada: o
# check que conta é o do último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: Build Frontend
        run: cd frontend && npm ci && npm run build
      # Coverage + piso de catraca (frontend/vitest.config.js): falha se a
      # cobertura do frontend regredir abaixo do minimo. Gera junit + html + lcov.
      - name: Test Frontend (coverage)
        run: cd frontend && npm run test:coverage
      - name: Build MCP Server
        run: cd mcp-server-niso && npm ci && npm run build
      # Roda com cobertura (istanbul) + piso de catraca do worker.
      # Sem retry: a flakiness de teardown (`fetch failed / other side closed`)
      # era do pool 0.4.x; no 0.20 (pool reescrito) não reproduz. Se voltar a
      # aparecer, re-adicionar o retry gateado por assinatura — um flake é
      # não-destrutivo (basta re-rodar).
      - name: Run Tests
        run: npm run test:coverage

      # Publica os relatorios (junit dos dois suites + cobertura html/lcov do
      # frontend) como artefato do run. `always()` para sair MESMO em falha —
      # e justamente quando falha que se quer o detalhe.
      - name: Upload relatorios de teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: |
            test-results/**
            coverage/**
            frontend/test-results/**
            frontend/coverage/**
          if-no-files-found: ignore
          retention-days: 14

  # E2E de navegador real (Playwright) do frontend. Job separado: instala o
  # Chromium só aqui e não atrasa a suíte principal. Serve o build e mocka a API
  # por interceptação — não precisa de backend.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps + Chromium
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Build Frontend
        run: cd frontend && npm run build
      - name: Playwright E2E
        run: cd frontend && npm run test:e2e
      - name: Upload relatorios E2E
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-reports
          path: |
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14

  # Auditoria de dependências (S5 do backlog / OWASP A06). INFORMATIVO: só os jobs
  # `test` e `e2e` são exigidos pelo ruleset, então isto reporta vulnerabilidades
  # high+ sem bloquear o merge. Cada passo é continue-on-error para o job ficar
  # verde e servir de sinal, não de portão — apertar para bloqueante quando a base
  # estiver limpa. Não roda `npm ci`: `npm audit` só precisa do package-lock.json.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Audit (root)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Audit (frontend)
        continue-on-error: true
        run: cd frontend && npm audit --audit-level=high
      - name: Audit (mcp-server)
        continue-on-error: true
        run: cd mcp-server-niso && npm audit --audit-level=high
